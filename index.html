<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Trading Journal Calendar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f0f11;
      color: #e1e1e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 100px;
    }

    .header {
      padding: 12px 16px;
      background-color: #18181b;
      border-bottom: 1px solid #27272a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .header h1 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .btn-add {
      background-color: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .month-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: #121215;
      position: relative;
      z-index: 10;
    }

    .month-nav button {
      background: #27272a;
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .month-title {
      font-weight: 700;
      font-size: 1rem;
    }

    .calendar-container {
      width: 100%;
      padding: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      z-index: 10;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      width: 100%;
    }

    .day-header {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: #a1a1aa;
      padding: 4px 0;
      text-transform: uppercase;
    }

    .day-cell {
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 4px;
      min-height: 85px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      overflow: hidden;
      cursor: pointer;
    }

    .day-number {
      font-size: 0.75rem;
      font-weight: 600;
      color: #a1a1aa;
    }

    .trade-card {
      border-radius: 4px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .trade-card.profit {
      background-color: rgba(22, 101, 52, 0.35);
      border: 1px solid #166534;
    }

    .trade-card.loss {
      background-color: rgba(153, 27, 27, 0.35);
      border: 1px solid #991b1b;
    }

    .pnl-amount {
      font-weight: 700;
      font-size: clamp(0.65rem, 2.2vw, 0.85rem);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .trade-card.profit .pnl-amount { color: #4ade80; }
    .trade-card.loss .pnl-amount { color: #f87171; }

    .trade-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.6rem;
      color: #a1a1aa;
    }

    .asset-badge {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 1px 3px;
      border-radius: 2px;
      font-size: 0.55rem;
      text-transform: uppercase;
    }

    @media (max-width: 500px) {
      .day-cell {
        min-height: 68px;
        padding: 3px;
      }
      .day-header {
        font-size: 0.65rem;
      }
      .asset-badge {
        display: none;
      }
    }

    @media (min-width: 501px) and (max-width: 900px) and (orientation: landscape) {
      .day-cell {
        min-height: 95px;
      }
      .asset-badge {
        display: inline-block;
      }
    }

    /* ===== VIEWS (Calendar / Analytics / Settings) ===== */
    .view {
      display: none;
    }
    .view.active {
      display: block;
    }

    .analytics-wrap, .settings-wrap {
      padding: 16px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-card {
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 14px;
    }

    .stat-label {
      font-size: 0.7rem;
      color: #a1a1aa;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .stat-value.positive { color: #4ade80; }
    .stat-value.negative { color: #f87171; }

    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      margin: 18px 0 10px 0;
      color: #e1e1e6;
    }

    .trade-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .settings-row-label {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .settings-row-desc {
      font-size: 0.75rem;
      color: #a1a1aa;
      margin-top: 2px;
    }

    .btn-danger {
      background-color: #991b1b;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 99999;
      pointer-events: none;
    }

    .modal-overlay.open {
      display: flex !important;
      pointer-events: auto !important;
    }

    .modal-content {
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
    }

    .modal-header {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: #a1a1aa;
      margin-bottom: 6px;
    }

    .type-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .type-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid #27272a;
      background: #27272a;
      color: #a1a1aa;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .type-btn.active-profit {
      background-color: #166534;
      color: #4ade80;
      border-color: #22c55e;
    }

    .type-btn.active-loss {
      background-color: #991b1b;
      color: #f87171;
      border-color: #ef4444;
    }

    .form-input {
      width: 100%;
      padding: 10px;
      background-color: #0f0f11;
      border: 1px solid #27272a;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-submit {
      flex: 1;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel {
      flex: 1;
      background-color: #27272a;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background-color: #18181b;
      border-top: 1px solid #27272a;
      display: flex;
      justify-content: space-around;
      padding: 12px 0 16px 0;
      z-index: 1000;
      pointer-events: auto;
    }

    .nav-item {
      color: #a1a1aa;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
      cursor: pointer;
      background: none;
      border: none;
    }

    .nav-icon {
      font-size: 1.5rem;
      line-height: 1;
    }

    .nav-item.active {
      color: #3b82f6;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>Trading Journal</h1>
    <button class="btn-add" onclick="openModal()">+ Add Trade</button>
  </div>

  <!-- ===== CALENDAR VIEW ===== -->
  <div class="view active" id="view-Calendar">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">&lt;</button>
      <div class="month-title" id="monthDisplay">July 2026</div>
      <button onclick="changeMonth(1)">&gt;</button>
    </div>

    <div class="calendar-container">
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </div>

  <!-- ===== ANALYTICS VIEW ===== -->
  <div class="view" id="view-Analytics">
    <div class="analytics-wrap">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">Total P&amp;L</div>
          <div class="stat-value" id="statTotalPnl">$0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Win Rate</div>
          <div class="stat-value" id="statWinRate">0%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Trades</div>
          <div class="stat-value" id="statTotalTrades">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg P&amp;L / Day</div>
          <div class="stat-value" id="statAvgPnl">$0.00</div>
        </div>
      </div>

      <div class="section-title">Recent Trades</div>
      <div id="recentTradesList"></div>
    </div>
  </div>

  <!-- ===== SETTINGS VIEW ===== -->
  <div class="view" id="view-Settings">
    <div class="settings-wrap">
      <div class="section-title" style="margin-top:0;">Preferences</div>

      <div class="settings-row">
        <div>
          <div class="settings-row-label">Default asset</div>
          <div class="settings-row-desc">Used to pre-fill new trades</div>
        </div>
        <input type="text" class="form-input" style="width:90px; text-align:center;" id="defaultAssetInput" value="MNQ" />
      </div>

      <div class="settings-row">
        <div>
          <div class="settings-row-label">Clear all trades</div>
          <div class="settings-row-desc">Removes every logged trade</div>
        </div>
        <button class="btn-danger" onclick="clearAllTrades()">Clear</button>
      </div>
    </div>
  </div>

  <!-- Trade Entry Modal -->
  <div class="modal-overlay" id="tradeModal">
    <div class="modal-content">
      <div class="modal-header">Log Trade</div>

      <label style="font-size:0.75rem; color:#a1a1aa; margin-bottom:6px; display:block;">Trade Result</label>
      <div class="type-toggle">
        <button type="button" class="type-btn active-profit" id="btnProfit" onclick="setTradeType('profit')">+ Profit</button>
        <button type="button" class="type-btn" id="btnLoss" onclick="setTradeType('loss')">- Loss</button>
      </div>

      <div class="form-group">
        <label for="tradeDate">Date</label>
        <input type="date" id="tradeDate" class="form-input" />
      </div>

      <div class="form-group">
        <label for="tradeAmount">Amount ($)</label>
        <input type="number" step="any" id="tradeAmount" class="form-input" placeholder="e.g. 300" />
      </div>

      <div class="form-group">
        <label for="tradeAsset">Asset</label>
        <input type="text" id="tradeAsset" class="form-input" placeholder="MNQ, NQ, Gold..." value="MNQ" />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn-submit" onclick="saveTrade()">Save Trade</button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <button class="nav-item active" id="tab-Calendar" onclick="switchTab('Calendar')">
      <span class="nav-icon">📅</span>
      <span>Calendar</span>
    </button>
    <button class="nav-item" id="tab-Analytics" onclick="switchTab('Analytics')">
      <span class="nav-icon">📊</span>
      <span>Analytics</span>
    </button>
    <button class="nav-item" id="tab-Settings" onclick="switchTab('Settings')">
      <span class="nav-icon">⚙️</span>
      <span>Settings</span>
    </button>
  </div>

  <script>
    var currentDate = new Date(2026, 6, 1);
    var selectedTradeType = 'profit';

    var trades = [
      { date: '2026-07-20', amount: 313.50, asset: 'MNQ', count: 1 },
      { date: '2026-07-21', amount: -300.00, asset: 'MNQ', count: 2 }
    ];

    // ---------- TAB SWITCHING ----------
    function switchTab(tabName) {
      ['Calendar', 'Analytics', 'Settings'].forEach(function(name) {
        document.getElementById('view-' + name).classList.remove('active');
        document.getElementById('tab-' + name).classList.remove('active');
      });
      document.getElementById('view-' + tabName).classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');

      if (tabName === 'Analytics') {
        renderAnalytics();
      }
    }

    function renderAnalytics() {
      var total = 0;
      var wins = 0;
      trades.forEach(function(t) {
        total += t.amount;
        if (t.amount >= 0) wins++;
      });
      var winRate = trades.length ? Math.round((wins / trades.length) * 100) : 0;
      var avg = trades.length ? total / trades.length : 0;

      var totalEl = document.getElementById('statTotalPnl');
      totalEl.textContent = (total >= 0 ? '+' : '-') + '$' + Math.abs(total).toFixed(2);
      totalEl.className = 'stat-value ' + (total >= 0 ? 'positive' : 'negative');

      document.getElementById('statWinRate').textContent = winRate + '%';
      document.getElementById('statTotalTrades').textContent = trades.length;

      var avgEl = document.getElementById('statAvgPnl');
      avgEl.textContent = (avg >= 0 ? '+' : '-') + '$' + Math.abs(avg).toFixed(2);
      avgEl.className = 'stat-value ' + (avg >= 0 ? 'positive' : 'negative');

      var list = document.getElementById('recentTradesList');
      var sorted = trades.slice().sort(function(a, b) { return b.date.localeCompare(a.date); });
      list.innerHTML = sorted.map(function(t) {
        var isLoss = t.amount < 0;
        var formatted = (t.amount >= 0 ? '+' : '-') + '$' + Math.abs(t.amount).toFixed(2);
        var color = isLoss ? '#f87171' : '#4ade80';
        return '<div class="trade-list-item">' +
                 '<span>' + t.date + ' &middot; ' + t.asset + '</span>' +
                 '<span style="color:' + color + '; font-weight:700;">' + formatted + '</span>' +
               '</div>';
      }).join('') || '<div class="settings-row-desc">No trades logged yet.</div>';
    }

    function clearAllTrades() {
      if (confirm('Remove all logged trades? This cannot be undone.')) {
        trades = [];
        renderCalendar();
        renderAnalytics();
      }
    }

    // ---------- MODAL ----------
    function openModal(dateStr) {
      document.getElementById('tradeDate').value = dateStr || toDateKey(currentDate.getFullYear(), currentDate.getMonth(), new Date().getDate());
      document.getElementById('tradeAmount').value = '';
      var defaultAsset = document.getElementById('defaultAssetInput');
      document.getElementById('tradeAsset').value = defaultAsset ? defaultAsset.value : 'MNQ';
      setTradeType('profit');
      document.getElementById('tradeModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('tradeModal').classList.remove('open');
    }

    function toDateKey(year, month, day) {
      var monthStr = String(month + 1).padStart(2, '0');
      var dayStr = String(day).padStart(2, '0');
      return year + '-' + monthStr + '-' + dayStr;
    }

    // ---------- PROFIT/LOSS TOGGLE ----------
    // Fixed: the toggle buttons are now the single source of truth for sign.
    // Typing an amount no longer silently flips the toggle back.
    function setTradeType(type) {
      selectedTradeType = type;
      var btnProfit = document.getElementById('btnProfit');
      var btnLoss = document.getElementById('btnLoss');

      if (type === 'profit') {
        btnProfit.className = 'type-btn active-profit';
        btnLoss.className = 'type-btn';
      } else {
        btnProfit.className = 'type-btn';
        btnLoss.className = 'type-btn active-loss';
      }
    }

    // ---------- CALENDAR ----------
    function renderCalendar() {
      var year = currentDate.getFullYear();
      var month = currentDate.getMonth();

      var monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      document.getElementById('monthDisplay').innerText = monthNames[month] + " " + year;

      var grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      var days = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
      days.forEach(function(day) {
        grid.innerHTML += '<div class="day-header">' + day + '</div>';
      });

      var firstDayOfMonth = new Date(year, month, 1);
      var startingDay = firstDayOfMonth.getDay() - 1;
      if (startingDay === -1) startingDay = 6;

      var totalDays = new Date(year, month + 1, 0).getDate();

      for (var i = 0; i < startingDay; i++) {
        grid.innerHTML += '<div class="day-cell" style="opacity:0.2;"></div>';
      }

      for (var day = 1; day <= totalDays; day++) {
        var dateKey = toDateKey(year, month, day);

        var dayTrade = trades.find(function(t) { return t.date === dateKey; });

        var tradeHTML = '';
        if (dayTrade) {
          var isLoss = dayTrade.amount < 0;
          var formattedAmount = (dayTrade.amount >= 0 ? '+' : '-') + '$' + Math.abs(dayTrade.amount).toFixed(2);
          var cardClass = isLoss ? 'loss' : 'profit';

          tradeHTML =
            '<div class="trade-card ' + cardClass + '">' +
              '<span class="pnl-amount">' + formattedAmount + '</span>' +
              '<div class="trade-meta">' +
                '<span>' + (dayTrade.count || 1) + ' trade' + ((dayTrade.count > 1) ? 's' : '') + '</span>' +
                '<span class="asset-badge">' + dayTrade.asset + '</span>' +
              '</div>' +
            '</div>';
        }

        grid.innerHTML +=
          '<div class="day-cell" onclick="openModal(\'' + dateKey + '\')">' +
            '<span class="day-number">' + day + '</span>' +
            tradeHTML +
          '</div>';
      }
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function saveTrade() {
      var date = document.getElementById('tradeDate').value;
      var amountInput = document.getElementById('tradeAmount').value;
      var amount = parseFloat(amountInput);
      var asset = document.getElementById('tradeAsset').value || 'MNQ';

      if (!date || isNaN(amount)) {
        alert('Please enter a valid date and amount.');
        return;
      }

      // Sign is decided purely by which toggle button is active.
      amount = Math.abs(amount);
      if (selectedTradeType === 'loss') {
        amount = -amount;
      }

      var existing = trades.find(function(t) { return t.date === date; });
      if (existing) {
        existing.amount = amount;
        existing.asset = asset;
        existing.count = (existing.count || 1) + 1;
      } else {
        trades.push({ date: date, amount: amount, asset: asset, count: 1 });
      }

      closeModal();
      renderCalendar();
    }

    renderCalendar();
  </script>
</body>
</html>
