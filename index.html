<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Trading Journal Calendar</title>
  <style>
    /* ==========================================
       1. BASE & RESPONSIVE RESET
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f0f11;
      color: #e1e1e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 70px;
    }

    /* Header Bar */
    .header {
      padding: 12px 16px;
      background-color: #18181b;
      border-bottom: 1px solid #27272a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .btn-add {
      background-color: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Month Controls */
    .month-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: #121215;
    }

    .month-nav button {
      background: #27272a;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .month-title {
      font-weight: 700;
      font-size: 1rem;
    }

    /* ==========================================
       2. CALENDAR GRID (Portrait & Landscape Fixes)
       ========================================== */
    .calendar-container {
      width: 100%;
      padding: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      width: 100%;
    }

    .day-header {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: #a1a1aa;
      padding: 4px 0;
      text-transform: uppercase;
    }

    .day-cell {
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 4px;
      min-height: 85px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      overflow: hidden;
    }

    .day-number {
      font-size: 0.75rem;
      font-weight: 600;
      color: #a1a1aa;
    }

    /* Trade Card Box Inside Days */
    .trade-card {
      border-radius: 4px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .trade-card.profit {
      background-color: rgba(22, 101, 52, 0.35);
      border: 1px solid #166534;
    }

    .trade-card.loss {
      background-color: rgba(153, 27, 27, 0.35);
      border: 1px solid #991b1b;
    }

    .pnl-amount {
      font-weight: 700;
      font-size: clamp(0.65rem, 2.2vw, 0.85rem);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .trade-card.profit .pnl-amount { color: #4ade80; }
    .trade-card.loss .pnl-amount { color: #f87171; }

    .trade-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.6rem;
      color: #a1a1aa;
    }

    .asset-badge {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 1px 3px;
      border-radius: 2px;
      font-size: 0.55rem;
      text-transform: uppercase;
    }

    /* Mobile Portrait Specifics */
    @media (max-width: 500px) {
      .day-cell {
        min-height: 68px;
        padding: 3px;
      }

      .day-header {
        font-size: 0.65rem;
      }

      .asset-badge {
        display: none;
      }
    }

    /* Mobile Landscape Specifics */
    @media (min-width: 501px) and (max-width: 900px) and (orientation: landscape) {
      .day-cell {
        min-height: 95px;
      }
      
      .asset-badge {
        display: inline-block;
      }
    }

    /* ==========================================
       3. MODAL & FORM 
       ========================================== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none; /* Changed from opacity for bulletproof toggle */
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
    }

    .modal-header {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: #a1a1aa;
      margin-bottom: 6px;
    }

    .type-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .type-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid #27272a;
      background: #27272a;
      color: #a1a1aa;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .type-btn.active-profit {
      background-color: #166534;
      color: #4ade80;
      border-color: #22c55e;
    }

    .type-btn.active-loss {
      background-color: #991b1b;
      color: #f87171;
      border-color: #ef4444;
    }

    .form-input {
      width: 100%;
      padding: 10px;
      background-color: #0f0f11;
      border: 1px solid #27272a;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-submit {
      flex: 1;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel {
      flex: 1;
      background-color: #27272a;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Bottom Nav Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background-color: #18181b;
      border-top: 1px solid #27272a;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }

    .nav-item {
      color: #a1a1aa;
      font-size: 0.7rem;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .nav-item.active {
      color: #3b82f6;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>Trading Journal</h1>
    <button class="btn-add" id="openModalBtn">+ Add Trade</button>
  </div>

  <!-- Month Navigation -->
  <div class="month-nav">
    <button id="prevMonthBtn">&lt;</button>
    <div class="month-title" id="monthDisplay">July 2026</div>
    <button id="nextMonthBtn">&gt;</button>
  </div>

  <!-- Calendar Container -->
  <div class="calendar-container">
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <!-- Trade Entry Modal -->
  <div class="modal-overlay" id="tradeModal">
    <div class="modal-content">
      <div class="modal-header">Log Trade</div>

      <label style="font-size:0.75rem; color:#a1a1aa; margin-bottom:6px; display:block;">Trade Result</label>
      <div class="type-toggle">
        <button type="button" class="type-btn active-profit" id="btnProfit">+ Profit</button>
        <button type="button" class="type-btn" id="btnLoss">- Loss</button>
      </div>

      <div class="form-group">
        <label for="tradeDate">Date</label>
        <input type="date" id="tradeDate" class="form-input" />
      </div>

      <div class="form-group">
        <label for="tradeAmount">Amount ($)</label>
        <input type="number" step="any" id="tradeAmount" class="form-input" placeholder="e.g. 300 or -300" />
      </div>

      <div class="form-group">
        <label for="tradeAsset">Asset</label>
        <input type="text" id="tradeAsset" class="form-input" placeholder="MNQ, NQ, Gold..." value="MNQ" />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="closeModalBtn">Cancel</button>
        <button type="button" class="btn-submit" id="saveTradeBtn">Save Trade</button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <a href="#" class="nav-item active">📅 Calendar</a>
    <a href="#" class="nav-item">📊 Analytics</a>
    <a href="#" class="nav-item">⚙️ Settings</a>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let currentDate = new Date(2026, 6, 1);
      let selectedTradeType = 'profit';

      let trades = [
        { date: '2026-07-20', amount: 313.50, asset: 'MNQ', count: 1 },
        { date: '2026-07-21', amount: -300.00, asset: 'MNQ', count: 2 }
      ];

      // Elements
      const openModalBtn = document.getElementById('openModalBtn');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const saveTradeBtn = document.getElementById('saveTradeBtn');
      const prevMonthBtn = document.getElementById('prevMonthBtn');
      const nextMonthBtn = document.getElementById('nextMonthBtn');
      const btnProfit = document.getElementById('btnProfit');
      const btnLoss = document.getElementById('btnLoss');
      const tradeAmountInput = document.getElementById('tradeAmount');
      const tradeModal = document.getElementById('tradeModal');

      // Bind Event Listeners Directly
      openModalBtn.addEventListener('click', openModal);
      closeModalBtn.addEventListener('click', closeModal);
      saveTradeBtn.addEventListener('click', saveTrade);
      prevMonthBtn.addEventListener('click', () => changeMonth(-1));
      nextMonthBtn.addEventListener('click', () => changeMonth(1));

      btnProfit.addEventListener('click', () => setTradeType('profit'));
      btnLoss.addEventListener('click', () => setTradeType('loss'));
      tradeAmountInput.addEventListener('input', (e) => handleAmountInput(e.target));

      renderCalendar();

      function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        document.getElementById('monthDisplay').innerText = `${monthNames[month]} ${year}`;

        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        const days = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
        days.forEach(day => {
          grid.innerHTML += `<div class="day-header">${day}</div>`;
        });

        const firstDayOfMonth = new Date(year, month, 1);
        let startingDay = firstDayOfMonth.getDay() - 1;
        if (startingDay === -1) startingDay = 6;

        const totalDays = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < startingDay; i++) {
          grid.innerHTML += `<div class="day-cell" style="opacity:0.2;"></div>`;
        }

        for (let day = 1; day <= totalDays; day++) {
          const monthStr = String(month + 1).padStart(2, '0');
          const dayStr = String(day).padStart(2, '0');
          const dateKey = `${year}-${monthStr}-${dayStr}`;

          const dayTrade = trades.find(t => t.date === dateKey);

          let tradeHTML = '';
          if (dayTrade) {
            const isLoss = dayTrade.amount < 0;
            const formattedAmount = `${dayTrade.amount >= 0 ? '+' : '-'}$${Math.abs(dayTrade.amount).toFixed(2)}`;
            const cardClass = isLoss ? 'loss' : 'profit';

            tradeHTML = `
              <div class="trade-card ${cardClass}">
                <span class="pnl-amount">${formattedAmount}</span>
                <div class="trade-meta">
                  <span>${dayTrade.count || 1} trade${dayTrade.count > 1 ? 's' : ''}</span>
                  <span class="asset-badge">${dayTrade.asset}</span>
                </div>
              </div>
            `;
          }

          grid.innerHTML += `
            <div class="day-cell">
              <span class="day-number">${day}</span>
              ${tradeHTML}
            </div>
          `;
        }
      }

      function changeMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendar();
      }

      function openModal() {
        document.getElementById('tradeDate').value = '2026-07-21';
        tradeAmountInput.value = '';
        setTradeType('profit');
        tradeModal.classList.add('active');
      }

      function closeModal() {
        tradeModal.classList.remove('active');
      }

      function setTradeType(type) {
        selectedTradeType = type;
        if (type === 'profit') {
          btnProfit.className = 'type-btn active-profit';
          btnLoss.className = 'type-btn';
          if (tradeAmountInput.value < 0) {
            tradeAmountInput.value = Math.abs(tradeAmountInput.value);
          }
        } else {
          btnProfit.className = 'type-btn';
          btnLoss.className = 'type-btn active-loss';
          if (tradeAmountInput.value > 0) {
            tradeAmountInput.value = -Math.abs(tradeAmountInput.value);
          }
        }
      }

      function handleAmountInput(input) {
        const val = parseFloat(input.value);
        if (!isNaN(val)) {
          if (val < 0 && selectedTradeType !== 'loss') {
            setTradeType('loss');
          } else if (val > 0 && selectedTradeType !== 'profit') {
            setTradeType('profit');
          }
        }
      }

      function saveTrade() {
        const date = document.getElementById('tradeDate').value;
        let amount = parseFloat(tradeAmountInput.value);
        const asset = document.getElementById('tradeAsset').value || 'MNQ';

        if (!date || isNaN(amount)) {
          alert('Please enter a valid date and amount.');
          return;
        }

        if (selectedTradeType === 'loss' && amount > 0) {
          amount = -amount;
        } else if (selectedTradeType === 'profit' && amount < 0) {
          amount = Math.abs(amount);
        }

        const existing = trades.find(t => t.date === date);
        if (existing) {
          existing.amount = amount;
          existing.asset = asset;
        } else {
          trades.push({ date, amount, asset, count: 1 });
        }

        closeModal();
        renderCalendar();
      }
    });
  </script>
</body>
</html>
