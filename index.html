<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Trading Journal Calendar</title>
  <style>
    /* RESET & BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f0f11;
      color: #e1e1e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 90px; /* Increased bottom padding to accommodate larger nav bar */
    }

    /* HEADER */
    .header {
      padding: 12px 16px;
      background-color: #18181b;
      border-bottom: 1px solid #27272a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .btn-add {
      background-color: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* MONTH NAV */
    .month-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: #121215;
    }

    .month-nav button {
      background: #27272a;
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .month-title {
      font-weight: 700;
      font-size: 1rem;
    }

    /* CALENDAR GRID */
    .calendar-container {
      width: 100%;
      padding: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      width: 100%;
    }

    .day-header {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: #a1a1aa;
      padding: 4px 0;
      text-transform: uppercase;
    }

    .day-cell {
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 4px;
      min-height: 85px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      overflow: hidden;
    }

    .day-number {
      font-size: 0.75rem;
      font-weight: 600;
      color: #a1a1aa;
    }

    .trade-card {
      border-radius: 4px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .trade-card.profit {
      background-color: rgba(22, 101, 52, 0.35);
      border: 1px solid #166534;
    }

    .trade-card.loss {
      background-color: rgba(153, 27, 27, 0.35);
      border: 1px solid #991b1b;
    }

    .pnl-amount {
      font-weight: 700;
      font-size: clamp(0.65rem, 2.2vw, 0.85rem);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .trade-card.profit .pnl-amount { color: #4ade80; }
    .trade-card.loss .pnl-amount { color: #f87171; }

    .trade-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.6rem;
      color: #a1a1aa;
    }

    .asset-badge {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 1px 3px;
      border-radius: 2px;
      font-size: 0.55rem;
      text-transform: uppercase;
    }

    /* PORTRAIT & LANDSCAPE FIXES */
    @media (max-width: 500px) {
      .day-cell {
        min-height: 68px;
        padding: 3px;
      }
      .day-header {
        font-size: 0.65rem;
      }
      .asset-badge {
        display: none;
      }
    }

    @media (min-width: 501px) and (max-width: 900px) and (orientation: landscape) {
      .day-cell {
        min-height: 95px;
      }
      .asset-badge {
        display: inline-block;
      }
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 9999;
    }

    .modal-overlay.open {
      display: flex !important;
    }

    .modal-content {
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
    }

    .modal-header {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: #a1a1aa;
      margin-bottom: 6px;
    }

    .type-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .type-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid #27272a;
      background: #27272a;
      color: #a1a1aa;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .type-btn.active-profit {
      background-color: #166534;
      color: #4ade80;
      border-color: #22c55e;
    }

    .type-btn.active-loss {
      background-color: #991b1b;
      color: #f87171;
      border-color: #ef4444;
    }

    .form-input {
      width: 100%;
      padding: 10px;
      background-color: #0f0f11;
      border: 1px solid #27272a;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-submit {
      flex: 1;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel {
      flex: 1;
      background-color: #27272a;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    /* LARGER BOTTOM NAVIGATION BAR */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background-color: #18181b;
      border-top: 1px solid #27272a;
      display: flex;
      justify-content: space-around;
      padding: 12px 0 16px 0; /* Expanded padding for comfortable touch area */
      z-index: 100;
    }

    .nav-item {
      color: #a1a1aa;
      font-size: 0.85rem; /* Increased text size */
      font-weight: 600;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
    }

    .nav-icon {
      font-size: 1.5rem; /* Enlarged icon size */
      line-height: 1;
    }

    .nav-item.active {
      color: #3b82f6;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>Trading Journal</h1>
    <button class="btn-add" onclick="openModal()">+ Add Trade</button>
  </div>

  <!-- Month Navigation -->
  <div class="month-nav">
    <button onclick="changeMonth(-1)">&lt;</button>
    <div class="month-title" id="monthDisplay">July 2026</div>
    <button onclick="changeMonth(1)">&gt;</button>
  </div>

  <!-- Calendar Container -->
  <div class="calendar-container">
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <!-- Trade Entry Modal -->
  <div class="modal-overlay" id="tradeModal">
    <div class="modal-content">
      <div class="modal-header">Log Trade</div>

      <label style="font-size:0.75rem; color:#a1a1aa; margin-bottom:6px; display:block;">Trade Result</label>
      <div class="type-toggle">
        <button type="button" class="type-btn active-profit" id="btnProfit" onclick="setTradeType('profit')">+ Profit</button>
        <button type="button" class="type-btn" id="btnLoss" onclick="setTradeType('loss')">- Loss</button>
      </div>

      <div class="form-group">
        <label for="tradeDate">Date</label>
        <input type="date" id="tradeDate" class="form-input" />
      </div>

      <div class="form-group">
        <label for="tradeAmount">Amount ($)</label>
        <input type="number" step="any" id="tradeAmount" class="form-input" placeholder="e.g. 300 or -300" oninput="handleAmountInput(this)" />
      </div>

      <div class="form-group">
        <label for="tradeAsset">Asset</label>
        <input type="text" id="tradeAsset" class="form-input" placeholder="MNQ, NQ, Gold..." value="MNQ" />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn-submit" onclick="saveTrade()">Save Trade</button>
      </div>
    </div>
  </div>

  <!-- Enlarged Bottom Navigation -->
  <div class="bottom-nav">
    <a href="#" class="nav-item active">
      <span class="nav-icon">📅</span>
      <span>Calendar</span>
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">📊</span>
      <span>Analytics</span>
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">⚙️</span>
      <span>Settings</span>
    </a>
  </div>

  <script>
    var currentDate = new Date(2026, 6, 1);
    var selectedTradeType = 'profit';

    var trades = [
      { date: '2026-07-20', amount: 313.50, asset: 'MNQ', count: 1 },
      { date: '2026-07-21', amount: -300.00, asset: 'MNQ', count: 2 }
    ];

    function openModal() {
      document.getElementById('tradeDate').value = '2026-07-21';
      document.getElementById('tradeAmount').value = '';
      setTradeType('profit');
      document.getElementById('tradeModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('tradeModal').classList.remove('open');
    }

    function setTradeType(type) {
      selectedTradeType = type;
      var btnProfit = document.getElementById('btnProfit');
      var btnLoss = document.getElementById('btnLoss');
      var amountInput = document.getElementById('tradeAmount');

      if (type === 'profit') {
        btnProfit.className = 'type-btn active-profit';
        btnLoss.className = 'type-btn';
        if (amountInput.value < 0) {
          amountInput.value = Math.abs(amountInput.value);
        }
      } else {
        btnProfit.className = 'type-btn';
        btnLoss.className = 'type-btn active-loss';
        if (amountInput.value > 0) {
          amountInput.value = -Math.abs(amountInput.value);
        }
      }
    }

    function handleAmountInput(input) {
      var val = parseFloat(input.value);
      if (!isNaN(val)) {
        if (val < 0 && selectedTradeType !== 'loss') {
          setTradeType('loss');
        } else if (val > 0 && selectedTradeType !== 'profit') {
          setTradeType('profit');
        }
      }
    }

    function renderCalendar() {
      var year = currentDate.getFullYear();
      var month = currentDate.getMonth();

      var monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      document.getElementById('monthDisplay').innerText = monthNames[month] + " " + year;

      var grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      var days = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
      days.forEach(function(day) {
        grid.innerHTML += '<div class="day-header">' + day + '</div>';
      });

      var firstDayOfMonth = new Date(year, month, 1);
      var startingDay = firstDayOfMonth.getDay() - 1;
      if (startingDay === -1) startingDay = 6;

      var totalDays = new Date(year, month + 1, 0).getDate();

      for (var i = 0; i < startingDay; i++) {
        grid.innerHTML += '<div class="day-cell" style="opacity:0.2;"></div>';
      }

      for (var day = 1; day <= totalDays; day++) {
        var monthStr = String(month + 1).padStart(2, '0');
        var dayStr = String(day).padStart(2, '0');
        var dateKey = year + '-' + monthStr + '-' + dayStr;

        var dayTrade = trades.find(function(t) { return t.date === dateKey; });

        var tradeHTML = '';
        if (dayTrade) {
          var isLoss = dayTrade.amount < 0;
          var formattedAmount = (dayTrade.amount >= 0 ? '+' : '-') + '$' + Math.abs(dayTrade.amount).toFixed(2);
          var cardClass = isLoss ? 'loss' : 'profit';

          tradeHTML = 
            '<div class="trade-card ' + cardClass + '">' +
              '<span class="pnl-amount">' + formattedAmount + '</span>' +
              '<div class="trade-meta">' +
                '<span>' + (dayTrade.count || 1) + ' trade' + ((dayTrade.count > 1) ? 's' : '') + '</span>' +
                '<span class="asset-badge">' + dayTrade.asset + '</span>' +
              '</div>' +
            '</div>';
        }

        grid.innerHTML += 
          '<div class="day-cell">' +
            '<span class="day-number">' + day + '</span>' +
            tradeHTML +
          '</div>';
      }
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function saveTrade() {
      var date = document.getElementById('tradeDate').value;
      var amountInput = document.getElementById('tradeAmount').value;
      var amount = parseFloat(amountInput);
      var asset = document.getElementById('tradeAsset').value || 'MNQ';

      if (!date || isNaN(amount)) {
        alert('Please enter a valid date and amount.');
        return;
      }

      if (selectedTradeType === 'loss' && amount > 0) {
        amount = -amount;
      } else if (selectedTradeType === 'profit' && amount < 0) {
        amount = Math.abs(amount);
      }

      var existing = trades.find(function(t) { return t.date === date; });
      if (existing) {
        existing.amount = amount;
        existing.asset = asset;
      } else {
        trades.push({ date: date, amount: amount, asset: asset, count: 1 });
      }

      closeModal();
      renderCalendar();
    }

    renderCalendar();
  </script>
</body>
</html>
